<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GIS - Data Kebakaran Lampung</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Turf.js for Spatial Analysis -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

    <!-- Theme Toggle -->
    <button id="themeToggle" class="theme-toggle-btn" title="Ganti Tema">
        <svg id="iconSun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="iconMoon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <!-- Coordinate Display -->
    <div id="coordDisplay" class="coord-display">Lat: -, Lng: -</div>

    <!-- UI Overlay -->
    <div class="panel-info">
        <h1>Persebaran Titik Api (Hotspot)</h1>
        <p class="panel-subtitle">Provinsi Lampung</p>
        
        <!-- Search -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari lokasi..." class="search-input">
            <button id="btnSearch" class="btn-search" title="Cari">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
        </div>

        <div class="slider-container">
            <div class="slider-header">
                <label for="yearSlider">Tahun: <span id="yearDisplay" class="highlight">Semua Tahun</span></label>
                <button id="btnPlay" class="btn-play" title="Mainkan Animasi Waktu">
                    <svg id="playIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <svg id="pauseIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                </button>
            </div>
            
            <input type="range" id="yearSlider" min="2017" max="2026" value="0" step="1">
            <div class="slider-labels">
                <span>2017</span>
                <span>2026</span>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <span class="stat-value" id="totalPoints">0</span>
                <span class="stat-label">Titik Api Aktif</span>
            </div>
        </div>

        <button id="btnAllYears" class="btn-outline">Tampilkan Semua Tahun</button>

        <!-- Modul Analisis Cerdas -->
        <div class="smart-modules-container">
            <div class="list-title">Modul Analisis Cerdas</div>
            <div class="module-toggles">
                <label class="toggle-btn" title="Pemetaan Zona Bahaya">
                    <input type="checkbox" id="modul1Toggle">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label"><i class="fa-solid fa-layer-group"></i> Modul 1: Hazard Zoning</span>
                </label>
                <label class="toggle-btn" title="Algoritma Jalur Evakuasi Cerdas">
                    <input type="checkbox" id="modul2Toggle">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label"><i class="fa-solid fa-route"></i> Modul 2: Jalur Evakuasi</span>
                </label>
                <label class="toggle-btn" title="Manajemen Spasial Posko Darurat">
                    <input type="checkbox" id="modul3Toggle">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label"><i class="fa-solid fa-tent"></i> Modul 3: Posko Darurat</span>
                </label>
                <label class="toggle-btn" title="Taktik Sekat Bakar & Mitigasi">
                    <input type="checkbox" id="modul4Toggle">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label"><i class="fa-solid fa-fire-extinguisher"></i> Modul 4: Sekat Bakar</span>
                </label>
            </div>
        </div>

        <!-- Daftar Hotspot Aktif -->
        <div class="hotspot-list-container">
            <div class="list-title">Daftar Titik Api</div>
            <div id="hotspotList" class="hotspot-list">
                <!-- Diisi via JS -->
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Heat JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
